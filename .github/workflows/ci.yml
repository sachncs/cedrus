name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint with ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.15.22
      - name: Run ruff check
        run: ruff check .

  typecheck:
    name: Type-check with mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install mypy
        run: pip install mypy==1.13.0
      - name: Install package
        run: pip install -e ".[test]"
      - name: Run mypy strict
        run: python -m mypy

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: pip install -e ".[test]"
      - name: Run pytest with coverage
        run: |
          pytest --cov=cedrus --cov-report=term --cov-report=xml --cov-fail-under=87
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

  package:
    name: Build and smoke-test package
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Install wheel in clean environment
        run: |
          python -m venv /tmp/cedrus-wheel
          /tmp/cedrus-wheel/bin/python -m pip install dist/*.whl
          /tmp/cedrus-wheel/bin/python -c "import cedrus; assert cedrus.__version__ == '0.8.0'"
          /tmp/cedrus-wheel/bin/cedrus --help

  security:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Audit dependencies
        run: |
          python -m pip install --upgrade pip-audit
          python -m pip install .
          pip-audit
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2

  docs:
    name: Verify documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check required documentation files
        run: |
          test -f README.md
          test -f CHANGELOG.md
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f SECURITY.md
          test -f LICENSE
          test -f NOTICE
      - name: Verify docs directory has required guides
        run: |
          test -f docs/architecture.md
          test -f docs/cli.md
          test -f docs/python-api.md
          test -f docs/deployment.md
          test -f docs/verification.md
      - name: Verify Markdown links resolve to existing files
        run: |
          python scripts/check_markdown_links.py README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md SUPPORT.md \
            docs/architecture.md docs/cli.md docs/python-api.md docs/deployment.md docs/verification.md \
            examples/README.md
