name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    name: Test on tag (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Verify tag matches package version
        run: |
          python -c "
          import sys
          tag = '${{ github.ref_name }}'.lstrip('v')
          if not tag:
              print('release tag is empty', file=sys.stderr)
              sys.exit(1)
          "
          python scripts/check_release_consistency.py '${{ github.ref_name }}'
      - name: Install package
        run: pip install -e ".[test]"
      - name: Run pytest with coverage
        run: pytest --cov=cedrus --cov-fail-under=87

  site:
    name: Validate tagged site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Audit site dependencies
        working-directory: site
        run: npm audit --audit-level=high
      - name: Build tagged site
        working-directory: site
        run: npm run build
      - name: Smoke-test tagged output
        run: |
          cp site/dist/index.html site/dist/404.html
          touch site/dist/.nojekyll
          python scripts/check_site.py site/dist

  publish:
    name: Build, sign, and publish to PyPI
    needs: [test, site]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build distribution
        run: |
          python -m pip install build
          python -m build
          python -m pip install twine
          python -m twine check dist/*
      - name: Verify artifact names match the tag
        run: |
          python - <<'PY'
          import pathlib
          import sys
          tag = '${{ github.ref_name }}'.lstrip('v')
          artifacts = list(pathlib.Path('dist').glob('cedrus-*'))
          if not artifacts or any(f'cedrus-{tag}' not in artifact.name for artifact in artifacts):
              print(f'artifacts do not match tag {tag}: {artifacts}', file=sys.stderr)
              raise SystemExit(1)
          PY
      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install cyclonedx-bom
          cyclonedx-py environment -o dist/sbom.cdx.json
      - name: Sign wheel with sigstore cosign
        uses: sigstore/cosign-installer@main
        with:
          cosign-release: "v2.4.1"
      - name: Sign distributions
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            cosign sign-blob --yes \
              --output-signature "$artifact.sig" \
              "$artifact"
          done
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
      - name: Upload release artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.cdx.json
            dist/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
